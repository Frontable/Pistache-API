services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pistache_user
      POSTGRES_PASSWORD: pistache_password
      POSTGRES_DB: pistache_api
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pistache_user -d pistache_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pistache_api
      DB_USER: pistache_user
      DB_PASSWORD: pistache_password
      JWT_SECRET: change-me-in-production
      PORT: "9080"
    ports:
      - "9080:9080"

volumes:
  pgdata:
